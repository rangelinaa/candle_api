services:
  db:
    image: postgres:16
    container_name: candle_db
    environment:
      POSTGRES_USER: candle
      POSTGRES_PASSWORD: candle_pass
      POSTGRES_DB: candle_shop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U candle -d candle_shop"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: candle_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
